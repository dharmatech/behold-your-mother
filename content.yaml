# Everything on the posters and the web page comes from this file.
# After editing it, run ./render.sh. README.md explains the format.

title: The New Adam & the New Eve
subtitle: how the first man and woman, the throne of David, and the Ark of the Covenant foreshadow Christ and his Mother
epigraph:
  text: “The New Testament lies hidden in the Old, and the Old is unveiled in the New.”
  by: St. Augustine (CCC 129)

# Sections and their parallels, in order.
# Each parallel belongs to the section above it.
contents:

# ── In the Beginning ────────────────────────────────────────────

- section: In the Beginning
  subtitle: the first man and woman

- type:
    title: Adam
    body:
      - |
        the first man, formed
        from the dust of the ground
      - italic: |
          “through the disobedience
          of the one man the many
          were made sinners”
        ref: Rom 5:19
    refs: Gen 2:7 · Rom 5:12, 19
  parallel:
    title: The New Adam
    body:
      - text: |
          Adam “is a pattern
          of the One to come”
        ref: Rom 5:14
      - italic: |
          “The first man Adam became a living being;
          the last Adam a life-giving spirit.”
        ref: 1 Cor 15:45
    refs: Rom 5:14 · 1 Cor 15:22, 45 · CCC 411, 504
  fulfillment:
    title: Jesus Christ
    body:
      - |
        the last Adam, the man from heaven,
        who begins the new creation
      - italic: |
          “through the obedience of the one man
          the many will be made righteous”
        ref: Rom 5:19
    refs: Rom 5:19 · 1 Cor 15:47

- type:
    title: Eve
    body:
      - |
        the first woman,
        formed from Adam's side
      - italic: |
          a virgin, she listened
          to the serpent and disobeyed
    refs: Gen 2:21–22; 3:1–6
  parallel:
    title: The New Eve
    body:
      - italic: |
          “the knot of Eve's disobedience
          was loosed by the obedience of Mary”
      - by: St. Irenaeus, c. 180
      - italic: “Death through Eve, life through Mary.”
      - by: the Fathers
    refs: St. Justin, _Dialogue_ 100 · CCC 411, 494, 726
  fulfillment:
    title: Mary
    body:
      - |
        a virgin, she listened
        to the angel and obeyed
      - italic: |
          “May it happen to me
          according to your word”
        ref: Lk 1:38
    refs: Lk 1:26–38

- type:
    title: The First Sin
    subtitle: in the garden of Eden
    body:
      - text: |
          Eve takes the fruit and eats;
          “She also gave some to her husband …
          and he ate it”
        ref: Gen 3:6
      - italic: |
          their eyes are opened:
          shame, exile from the garden, death
    refs: Gen 3:6–7, 19, 23
  parallel:
    title: At Her Urging
    body:
      - |
        In Eden, at Eve's urging,
        Adam commits the **first sin**.
      - |
        At Cana, at Mary's urging,
        Jesus performs his **first sign**.
      - italic: |
          Eve led her husband away from God's word;
          Mary points to it: “Do whatever He tells you.”
        ref: Jn 2:5
    refs: Gen 3:6 · Jn 2:3–5, 11 · CCC 1613, 2618
  fulfillment:
    title: The First Sign
    subtitle: the wedding at Cana
    body:
      - text: |
          at the wedding feast Mary tells him,
          “They have no more wine,” and tells
          the servants, “Do whatever He tells you”
        ref: Jn 2:3, 5
      - italic: |
          water becomes wine, “the first of His signs”:
          “He thus revealed His glory,
          and His disciples believed in Him”
        ref: Jn 2:11
    refs: Jn 2:1–11

- type:
    title: “Woman”
    body:
      - word: אִשָּׁה
        reading: ’ishshah
      - text: |
          “she shall be called ‘woman,’
          for out of man she was taken”
        ref: Gen 2:23
      - text: |
          through the whole story of the Fall
          she is simply “the woman” —
          only afterward is she named Eve
        ref: Gen 3:2, 20
      - italic: |
          “I will put enmity between you
          and the woman, and between
          your seed and her seed”
        ref: Gen 3:15
    refs: Gen 2:23; 3:1–16, 20
  parallel:
    title: Woman
    body:
      - |
        Jesus calls his mother not “Mother”
        but “Woman” — the name of Eve
        before the Fall
      - italic: |
          Mary is the Woman of the first Gospel,
          at enmity with the serpent (Gen 3:15)
    refs: CCC 410–411, 726
  fulfillment:
    title: “Woman”
    body:
      - word: γύναι
        reading: gynai
      - text: |
          at Cana:
          “Woman, … My hour has not yet come”
        ref: Jn 2:4
      - text: |
          at the Cross, when the hour has come:
          “Woman, here is your son.”
        ref: Jn 19:26
    refs: Jn 2:4; 19:26

# ── The Throne of David ─────────────────────────────────────────

- section: The Throne of David
  subtitle: the king and the queen mother

- type:
    title: Solomon
    subtitle: son of David, king of Israel
    body:
      - text: seated on the throne of David
        ref: 1 Kgs 2:12
      - italic: |
          God's promise to David's son:
          “I will establish the throne
          of his kingdom forever”
        ref: 2 Sam 7:13
    refs: 2 Sam 7:12–16 · 1 Kgs 2:12
  parallel:
    title: The King
    body:
      - |
        the promise to David's son
        is fulfilled in the everlasting
        reign of Christ
    refs: Mt 1:1 · Lk 1:32–33 · CCC 439
  fulfillment:
    title: Christ the King
    subtitle: Jesus, Son of David
    body:
      - italic: |
          “The Lord God will give Him
          the throne of His father David …
          His kingdom will never end!”
        ref: Lk 1:32–33
    refs: Lk 1:32–33

- type:
    title: Bathsheba
    subtitle: mother of King Solomon
    body:
      - word: גְּבִירָה
        reading: gebirah, “great lady”
      - text: |
          in the house of David the queen
          was the king's mother, not his wife:
          Solomon had 700 wives, but one mother
        ref: 1 Kgs 11:3
      - italic: |
          the king rises to meet her, bows,
          and sets a throne for her at his right hand;
          she brings petitions to the king
        ref: 1 Kgs 2:19–20
    refs: 1 Kgs 2:19–20; 11:3; 15:13 · Jer 13:18
  parallel:
    title: The Queen Mother
    body:
      - |
        the Son of David reigns for ever,
        and the queen of his kingdom
        is his mother
      - italic: |
          as Bathsheba brought petitions to Solomon,
          Mary brings our needs to her Son
    refs: Jn 2:3 · CCC 966, 969 · _Ad Caeli Reginam_
  fulfillment:
    title: Queen of Heaven
    subtitle: Mary, mother of the King
    body:
      - text: |
          Elizabeth greets her as
          “the mother of my Lord”
        ref: Lk 1:43
      - italic: |
          “a woman clothed in the sun …
          a crown of twelve stars on her head”
        ref: Rev 12:1
      - text: |
          assumed into heaven and “exalted
          by the Lord as Queen over all things”
        ref: CCC 966
    refs: Lk 1:43 · Rev 12:1 · CCC 966

# ── The Ark of the Covenant ─────────────────────────────────────

- section: The Ark of the Covenant
  subtitle: God's dwelling among his people

- type:
    title: The Ark
    subtitle: of the covenant, in the Holy of Holies
    body:
      - |
        a chest overlaid with gold;
        above it, between the cherubim,
        God met with his people
      - italic: “I will meet with you there”
        ref: Ex 25:22
    refs: Ex 25:10–22 · 1 Kgs 8:6–11
  parallel:
    title: The New Ark
    body:
      - |
        the ark held God's presence
        among his people; for nine months
        God himself dwelt within Mary
      - italic: |
          Mary is “the ark of the covenant,
          the place where the glory of the Lord dwells”
        ref: CCC 2676
    refs: "CCC 2676 · Litany of Loreto: “Ark of the Covenant”"
  fulfillment:
    title: Mary
    subtitle: the living ark
    body:
      - |
        God makes his dwelling not in a chest
        of wood and gold, but in her womb
      - italic: |
          “The Word became flesh
          and made His dwelling among us”
        ref: Jn 1:14
      - word: ἐσκήνωσεν
        reading: eskēnōsen, “pitched his tent”
    refs: Jn 1:14 · Lk 1:31

- type:
    title: What the Ark Held
    body:
      - text: |
          **the tablets of the Law**\
          the word of God, written in stone
        ref: Deut 10:5
      - text: |
          **a golden jar of manna**\
          bread from heaven in the wilderness
        ref: Ex 16:33–34
      - text: |
          **Aaron's rod that budded**\
          sign of the true priesthood
        ref: Num 17:8–10
    refs: Heb 9:4 · Deut 10:5 · Ex 16:33–34 · Num 17:8–10
  parallel:
    title: What She Carried
    body:
      - |
        the ark carried signs;
        Mary carried the One they signified
      - italic: |
          the Law  →  the Word\
          the manna  →  the Bread of Life\
          the priestly rod  →  the High Priest
    refs: Heb 9:4
  fulfillment:
    title: What Mary Carried
    body:
      - text: |
          **the Word of God**\
          made flesh
        ref: Jn 1:14
      - text: |
          **the living bread**\
          come down from heaven
        ref: Jn 6:51
      - text: |
          **the eternal high priest**\
          who holds his priesthood for ever
        ref: Heb 4:14; 7:24
    refs: Jn 1:14 · Jn 6:51 · Heb 4:14; 7:24

- type:
    title: The Glory Cloud
    subtitle: over the tabernacle
    body:
      - italic: |
          “the cloud covered the Tent of Meeting,
          and the glory of the LORD
          filled the tabernacle”
        ref: Ex 40:34
      - word: ἐπεσκίαζεν
        reading: epeskiazen, “overshadowed”
    refs: Ex 40:34–35 (LXX)
  parallel:
    title: Overshadowed
    body:
      - |
        the same Greek verb describes
        the glory cloud over the tabernacle
        and the Spirit over Mary
      - italic: |
          where God's glory rests,
          there God dwells
    refs: Ex 40:35 (LXX) · Lk 1:35 · CCC 697
  fulfillment:
    title: The Annunciation
    subtitle: over the Virgin
    body:
      - italic: |
          “The Holy Spirit will come upon you,
          and the power of the Most High
          will overshadow you”
        ref: Lk 1:35
      - word: ἐπισκιάσει
        reading: episkiasei, “will overshadow”
    refs: Lk 1:35

- type:
    title: A Holy Vessel
    body:
      - text: |
          made of acacia, “wood that does not decay”
          in the Greek, overlaid with pure gold
          within and without
        ref: Ex 25:10–11 (LXX)
      - text: |
          so holy that Uzzah,
          touching it, was struck dead
        ref: 2 Sam 6:6–7
      - italic: |
          “Arise, O LORD, to Your resting place,
          You and the ark of Your strength”
        ref: Ps 132:8
    refs: Ex 25:10–11 (LXX) · 2 Sam 6:6–7 · Ps 132:8
  parallel:
    title: Incorruptible
    body:
      - text: |
          Pius XII: the ark of incorruptible wood
          is “a type of the most pure body
          of the Virgin Mary,” preserved
          from the corruption of the tomb
        ref: _Munificentissimus Deus_ 26
    refs: _Munificentissimus Deus_ 26 · Ps 132:8
  fulfillment:
    title: Full of Grace
    subtitle: immaculate, and assumed into heaven
    body:
      - text: |
          preserved from every stain
          of sin from her conception
        ref: CCC 491
      - text: |
          at the end of her earthly life,
          taken body and soul into heavenly glory
        ref: CCC 966
    refs: Lk 1:28 · CCC 491–492, 966

- type:
    title: The Lost Ark
    body:
      - text: |
          before the Babylonian exile,
          Jeremiah hid the ark in a cave
        ref: 2 Macc 2:4–5
      - italic: |
          “The place shall be unknown
          until God gathers his people
          together again”
        ref: 2 Macc 2:7
    refs: 2 Macc 2:4–8
  parallel:
    title: The Ark Revealed
    body:
      - |
        John sees the lost ark in heaven,
        and the very next thing he sees
        is the Woman
      - italic: |
          the chapter break between them
          was added only in the 13th century
    refs: Rev 11:19 – 12:1
  fulfillment:
    title: The Ark in Heaven
    body:
      - italic: |
          “Then the temple of God in heaven
          was opened, and the ark of His covenant
          appeared in His temple …”
        ref: Rev 11:19
      - italic: |
          “And a great sign appeared in heaven:
          a woman clothed in the sun”
        ref: Rev 12:1
    refs: Rev 11:19 – 12:1

# ── The Ark Goes Up to Judah ────────────────────────────────────

- section: The Ark Goes Up to Judah
  subtitle: 2 Samuel 6 and the Visitation, Luke 1:39–56

- type:
    title: David Sets Out
    body:
      - italic: |
          “And he and all his troops set out
          for Baale of Judah to bring up
          from there the ark of God”
        ref: 2 Sam 6:2
    refs: 2 Sam 6:2 · 1 Chr 13:6
  parallel:
    title: Arose and Went
    body:
      - |
        in the Greek of both books,
        the two journeys open with
        the same two verbs, “arose”
        and “went”, and both go into Judah
    refs: 2 Sam 6:2 (LXX) · Lk 1:39
  fulfillment:
    title: Mary Sets Out
    body:
      - italic: |
          “Mary got ready and hurried
          to a town in the hill country
          of Judah”
        ref: Lk 1:39
    refs: Lk 1:39

- type:
    title: David Asks
    body:
      - afraid of the LORD after Uzzah's death
      - italic: |
          “How can the ark of the LORD
          ever come to me?”
        ref: 2 Sam 6:9
    refs: 2 Sam 6:9
  parallel:
    title: “Come to Me?”
    body:
      - |
        David asks how the ark could come to him;
        Elizabeth asks the same of Mary
      - italic: |
          “Mary's visitation to Elizabeth thus became
          a visit from God to his people”
        ref: CCC 717
    refs: 2 Sam 6:9 · Lk 1:43 · CCC 717
  fulfillment:
    title: Elizabeth Asks
    body:
      - italic: |
          “And why am I so honored,
          that the mother of my Lord
          should come to me?”
        ref: Lk 1:43
    refs: Lk 1:43

- type:
    title: David Dances
    body:
      - italic: |
          “David … danced with all his might
          before the LORD”
        ref: 2 Sam 6:14
      - text: |
          “leaping and dancing before the LORD,”
          while the Levites raise their voices
          with music before the ark
        ref: 2 Sam 6:16 · 1 Chr 16:4–5
    refs: 2 Sam 6:14–16 · 1 Chr 15:28; 16:4–5
  parallel:
    title: Leaping for Joy
    body:
      - |
        David leaps before the ark;
        John leaps before the One
        whom Mary carries
    refs: 2 Sam 6:16 · Lk 1:41, 44
  fulfillment:
    title: John Leaps
    body:
      - italic: |
          “the baby in my womb
          leaped for joy”
        ref: Lk 1:44
      - text: |
          “In a loud voice she exclaimed”:
          “exclaimed” is a rare Greek verb
          that the LXX uses for the Levites'
          music before the ark
        ref: Lk 1:42 · cf. 1 Chr 15:28 (LXX)
      - word: ἀνεφώνησεν
        reading: anephōnēsen
    refs: Lk 1:41–44 · cf. 1 Chr 15:28 (LXX)

- type:
    title: Three Months
    subtitle: in the house of Obed-edom
    body:
      - italic: |
          “the ark of the LORD remained
          in the house of Obed-edom the Gittite
          for three months, and the LORD
          blessed him and all his household”
        ref: 2 Sam 6:11
    refs: 2 Sam 6:10–12
  parallel:
    title: A House Blessed
    body:
      - |
        the ark stays three months
        and blesses the house that receives it;
        so does Mary
    refs: 2 Sam 6:11 · Lk 1:41–42, 56
  fulfillment:
    title: Three Months
    subtitle: in the house of Zechariah
    body:
      - italic: |
          “Mary stayed with Elizabeth
          for about three months”
        ref: Lk 1:56
      - text: |
          Elizabeth is “filled with the Holy Spirit”:
          “Blessed are you among women”
        ref: Lk 1:41–42
    refs: Lk 1:40–42, 56

# ── The New Rachel ─────────────────────────────────────────────

- section: The New Rachel
  subtitle: the mother who weeps for her children

- type:
    title: Rachel's Tomb
    subtitle: on the road to Bethlehem
    body:
      - text: |
          Rachel, Jacob's beloved wife,
          is buried “on the way to Ephrath
          (that is, Bethlehem)”
        ref: Gen 35:19
      - italic: |
          “Rachel weeping for her children
          and refusing to be comforted”
        ref: Jer 31:15
    refs: Gen 35:19–20 · Jer 31:15
  parallel:
    title: Rachel Weeping
    body:
      - |
        centuries after her death, Jeremiah
        hears Rachel weep for her children
        in exile; Matthew hears her again
        when the children of Bethlehem die,
        close by her tomb
      - italic: |
          Rachel's tears at Bethlehem
          foreshadow Mary's at the Cross
    refs: Jer 31:15 · Mt 2:17–18 · CCC 530
  fulfillment:
    title: The Holy Innocents
    subtitle: Herod's massacre at Bethlehem
    body:
      - text: |
          Herod “put to death all the boys
          in Bethlehem and its vicinity
          who were two years old and under”
        ref: Mt 2:16
      - text: |
          Joseph takes the child and his mother
          and flees by night to Egypt
        ref: Mt 2:14
      - italic: |
          “Then what was spoken through
          the prophet Jeremiah was fulfilled: …
          Rachel weeping for her children”
        ref: Mt 2:17–18
    refs: Mt 2:13–18

- type:
    title: Joseph's Dream
    subtitle: the sun, the moon and the stars
    body:
      - italic: |
          “the sun and moon and eleven stars
          were bowing down to me”
        ref: Gen 37:9
      - text: |
          Jacob reads the dream: “Will your
          mother and brothers and I actually
          come and bow down to the ground
          before you?”
        ref: Gen 37:10
      - |
        the sun is Jacob, the moon is Rachel,
        and the stars are the sons of Israel
    refs: Gen 37:9–11
  parallel:
    title: Under Her Feet
    body:
      - |
        John's vision takes up Joseph's dream:
        the sun, the moon and twelve stars
        now surround one woman
      - italic: |
          the moon, Rachel's sign, is under
          her feet, a sign of royal rule;
          the twelve stars of Israel crown her
    refs: Gen 37:9 · Ps 8:6 · Rev 12:1
  fulfillment:
    title: A Great Sign
    subtitle: the woman clothed in the sun
    body:
      - italic: |
          “a woman clothed in the sun,
          with the moon under her feet
          and a crown of twelve stars
          on her head”
        ref: Rev 12:1
      - text: |
          she “gave birth to a son, a male child,
          who will rule all the nations”
        ref: Rev 12:5
    refs: Rev 12:1–5

- type:
    title: Rachel's Labor
    subtitle: the birth of Benjamin
    body:
      - text: |
          “Rachel began to give birth,
          and her labor was difficult”
        ref: Gen 35:16
      - italic: |
          “with her last breath—for she
          was dying—she named him Ben-oni”
        ref: Gen 35:18
      - word: בֶּן־אוֹנִי
        reading: ben-’oni, “son of my sorrow”
    refs: Gen 35:16–18
  parallel:
    title: Son of Sorrow
    body:
      - |
        the Greek uses one word for both:
        Rachel's soul departs as she bears
        her second son; a sword pierces
        Mary's soul as she receives
        a new son at the Cross
      - word: ψυχή
        reading: psychē, “soul”
      - italic: |
          through sorrow, each becomes
          the mother of another son
    refs: Gen 35:18 (LXX) · Lk 2:35 · CCC 618
  fulfillment:
    title: Simeon's Sword
    subtitle: fulfilled at the Cross
    body:
      - italic: |
          “and a sword will pierce
          your soul as well”
        ref: Lk 2:35
      - text: |
          “Near the cross of Jesus
          stood His mother”
        ref: Jn 19:25
      - text: |
          Jesus likens his hour to childbirth:
          “A woman has pain in childbirth
          because her time has come”
        ref: Jn 16:21
      - word: ὥρα
        reading: hōra, “hour”
    refs: Lk 2:34–35 · Jn 16:21; 19:25 · CCC 529

- type:
    title: Benjamin
    subtitle: Rachel's second son
    body:
      - text: |
          “his father called him Benjamin”:
          son of the right hand
        ref: Gen 35:18
      - italic: |
          “May the beloved of the LORD
          rest secure in Him”
        ref: Deut 33:12
      - word: ἠγαπημένος
        reading: ēgapēmenos, “beloved”
      - text: |
          Joseph, raised up in Egypt,
          honors Benjamin above
          his brothers at the feast
        ref: Gen 43:33–34
    refs: Gen 35:18, 24; 43:33–34 · Deut 33:12 (LXX)
  parallel:
    title: The Beloved
    body:
      - text: |
          among the twelve sons of Israel,
          Benjamin is “beloved”; among
          the twelve apostles, one disciple
          is “the one whom Jesus loved”
        ref: Deut 33:12 · Jn 13:23
      - italic: |
          each is born of his mother's sorrow,
          a brother to her firstborn
    refs: Deut 33:12 · Jn 19:26 · Pitre, ch. 7
  fulfillment:
    title: The Disciple
    subtitle: whom Jesus loved
    body:
      - italic: |
          “One of His disciples,
          the one whom Jesus loved,
          was reclining at His side”
        ref: Jn 13:23
      - text: |
          at the Cross he stands by Mary,
          “the disciple whom He loved”
        ref: Jn 19:26
      - word: ἠγάπα
        reading: ēgapa, “he loved”
    refs: Jn 13:23; 19:26; 21:20

- type:
    title: Mother of Israel
    subtitle: Rachel the intercessor
    body:
      - text: |
          God answers Rachel's tears:
          “the reward for your work will come …
          your children will return”
        ref: Jer 31:16–17
      - italic: |
          in Jewish tradition, God restores
          Israel for Rachel's sake, after
          the prayers of Abraham
          and Moses have failed
    refs: Jer 31:15–17 · Lamentations Rabbah 24
  parallel:
    title: Our Mother
    body:
      - |
        Rachel is mother of all Israel,
        weeping and praying for her children;
        at the Cross Jesus gives his mother
        to the beloved disciple, and through
        him to every disciple
      - italic: |
          the dragon makes war on “the rest
          of her children”, all who “hold
          to the testimony of Jesus”
        ref: Rev 12:17
    refs: Rev 12:17 · CCC 963–964, 969
  fulfillment:
    title: Behold Your Mother
    subtitle: Mother of the Church
    body:
      - italic: |
          “Woman, here is your son.” …
          “Here is your mother.”
        ref: Jn 19:26–27
      - text: |
          “So from that hour, this disciple
          took her into his home”
        ref: Jn 19:27
      - text: |
          after the Ascension, Mary prays
          with the apostles in the upper room
        ref: Acts 1:14
    refs: Jn 19:25–27 · Acts 1:14

# ── The footer ─────────────────────────────────────────────────

notes:
  - Scripture quotations are from the Berean Standard Bible, except 2 Maccabees (RSV), which it does not include.
  - CCC = Catechism of the Catholic Church.  LXX = Septuagint, the Greek Old Testament.
  - St. Justin Martyr, _Dialogue with Trypho_ 100 · St. Irenaeus, _Against Heresies_ III.22.4
  - Pius XII, _Munificentissimus Deus_ (1950) and _Ad Caeli Reginam_ (1954)
  - The New Rachel follows Brant Pitre, _Jesus and the Jewish Roots of Mary_ (2018), chapters 7–8; the Benjamin parallel is his own proposal.
